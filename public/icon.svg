<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#7b61ff" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(0, 212, 255, 0.25)" stroke-width="4" />
  
  <!-- Subtle inner grid effect -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(0, 212, 255, 0.08)" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(123, 97, 255, 0.1)" stroke-width="1.5" />

  <!-- Nexus 'N' Symbol with glow -->
  <g filter="url(#glow)">
    <path d="M168 140 V372 L344 140 V372" 
          fill="none" 
          stroke="url(#nexusGrad)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Node points -->
    <circle cx="168" cy="140" r="14" fill="#00d4ff" />
    <circle cx="344" cy="140" r="14" fill="#38e89b" />
    <circle cx="168" cy="372" r="14" fill="#3b82f6" />
    <circle cx="344" cy="372" r="14" fill="#7b61ff" />
  </g>
</svg>
